plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.videosequencer'
    compileSdk 37

    lint {
        disable 'UseAppTint', 'MissingTranslation', 'ExtraTranslation'
    }

    defaultConfig {
        applicationId "com.videosequencer"
        minSdk 36
        targetSdk 36
        versionCode project.hasProperty('versionCode') ? project.property('versionCode').toInteger() : 10
        versionName "1.0-beta7"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86_64'
            universalApk false
        }
    }

    androidComponents {
        onVariants(selector().all(), { variant ->
            def abiCodes = ['armeabi-v7a': 0, 'arm64-v8a': 1, 'x86_64': 2]

            variant.outputs.forEach { output ->
                def abiFilter = output.filters.find { it.filterType.name() == "ABI" }
                if (abiFilter != null) {
                    def abi = abiFilter.identifier
                    if (abiCodes.containsKey(abi)) {
                        output.versionCode.set(output.versionCode.get() + abiCodes.get(abi))
                    }
                }
            }
        })
    }
}

dependencies {
    implementation 'com.google.android.exoplayer:exoplayer-core:2.19.1'
    implementation 'com.google.android.exoplayer:exoplayer-ui:2.19.1'
    implementation("com.antonkarpenko:ffmpeg-kit-full-gpl:2.1.0")
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'com.airbnb.android:lottie:6.7.1'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.lifecycle.viewmodel.ktx
    implementation libs.androidx.appcompat
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.recyclerview
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
}
